[package]
name = "envguard"
version = "0.1.0"
edition = "2024"
description = "A blazing-fast CLI tool to check .env sync, detect leaked secrets, and auto-generate .env.example"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["env", "dotenv", "security", "linter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
regex = "1.13.1"
