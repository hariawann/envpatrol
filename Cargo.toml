[package]
name = "envpatrol"
version = "0.1.0"
edition = "2024"
description = "A CLI tool to check .env synchronization, detect leaked secrets, and generate sanitized .env.example templates"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hariawann/envpatrol"
homepage = "https://github.com/hariawann/envpatrol"
keywords = ["env", "dotenv", "security", "linter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
regex = "1.13.1"
